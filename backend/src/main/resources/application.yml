spring:
  application:
    name: food-delivery
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/food_delivery}
    username: ${DATABASE_USERNAME:food_delivery}
    password: ${DATABASE_PASSWORD:food_delivery}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: food-delivery
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: record
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  demo-customer-id: ${DEMO_CUSTOMER_ID:demo-customer}
  delivery:
    simulation-interval-ms: ${DELIVERY_SIMULATION_INTERVAL_MS:15000}